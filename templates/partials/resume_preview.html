<div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-4">
  <div class="flex items-center justify-between border-b border-slate-100 pb-3">
    <div class="flex items-center gap-2">
      <span class="text-xl">📄</span>
      <div>
        <h3 class="text-sm font-bold text-slate-800">Resume Generated Successfully!</h3>
        <p class="text-xs text-slate-500">Session ID: <span class="font-mono">{{ session_id }}</span></p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a
        href="{{ download_url }}"
        target="_blank"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-md transition-colors flex items-center gap-1 shadow-sm"
      >
        <span>⬇ Download PDF</span>
      </a>
    </div>
  </div>

  <div class="space-y-2">
    <div class="flex items-center justify-between">
      <p class="text-xs font-medium text-slate-700">LaTeX Source (Section-wise populated):</p>
      <button
        onclick="navigator.clipboard.writeText(document.getElementById('tex-code').innerText); this.innerText = 'Copied!';"
        class="text-[11px] text-indigo-600 hover:underline"
      >
        Copy LaTeX
      </button>
    </div>
    <pre id="tex-code" class="bg-slate-900 text-slate-100 p-4 rounded-md text-xs font-mono max-h-80 overflow-y-auto whitespace-pre-wrap">{{ tex_content }}</pre>
  </div>
</div>
