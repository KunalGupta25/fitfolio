<div id="skill-{{ skill.id }}" class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-lg shadow-sm">
  <div class="flex items-center gap-3">
    <div>
      <h4 class="text-xs font-bold text-slate-800">{{ skill.name }}</h4>
      <div class="flex items-center gap-2 mt-0.5">
        <span class="text-[10px] text-slate-400 capitalize">{{ skill.confidence }}</span>
        {% if skill.evidence %}
          <span class="text-[10px] text-slate-400">· {{ skill.evidence }}</span>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="flex items-center gap-2">
    {% if skill.validated == 1 %}
      <span class="bg-emerald-100 text-emerald-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">
        ✅ Validated
      </span>
    {% elif skill.validated == -1 %}
      <span class="bg-rose-100 text-rose-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">
        ✗ Failed
      </span>
    {% else %}
      <span class="bg-slate-100 text-slate-600 text-[10px] font-medium px-2 py-0.5 rounded-full">
        ○ Self-reported
      </span>
      <button
        hx-get="/skills/{{ skill.id }}/test"
        hx-target="#skill-test-area"
        hx-swap="innerHTML"
        class="text-indigo-600 hover:underline text-[11px] font-medium"
      >
        Test →
      </button>
    {% endif %}

    <button
      hx-delete="/skills/{{ skill.id }}"
      hx-target="#skill-{{ skill.id }}"
      hx-swap="outerHTML"
      class="text-slate-300 hover:text-red-500 text-xs px-1.5 py-0.5 rounded transition-colors ml-1"
      title="Delete skill"
    >
      ✕
    </button>
  </div>
</div>
