<div id="test-modal-{{ skill.id }}" class="bg-indigo-50/70 border border-indigo-200 rounded-lg p-5 mb-6 space-y-4">
  <div class="flex items-start justify-between">
    <div>
      <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded">Skill Validation Test</span>
      <h3 class="text-sm font-bold text-slate-800 mt-1">Verify: {{ skill.name }}</h3>
      <p class="text-xs text-slate-500">Answer these quick questions to validate your skill. (Passing score: 60%)</p>
    </div>
    <button
      onclick="document.getElementById('test-modal-{{ skill.id }}').remove()"
      class="text-xs text-slate-400 hover:text-slate-600"
    >
      ✕ Skip Test
    </button>
  </div>

  <form
    hx-post="/skills/{{ skill.id }}/test/submit"
    hx-target="#test-modal-{{ skill.id }}"
    hx-swap="outerHTML"
    class="space-y-3"
  >
    {% for q in questions %}
      <div class="bg-white p-3 rounded border border-indigo-100 space-y-1">
        <label class="block text-xs font-medium text-slate-700">
          {{ loop.index }}. {{ q.question }}
        </label>
        <textarea
          name="answers"
          rows="2"
          required
          placeholder="Your concise technical answer..."
          class="w-full border border-slate-200 rounded p-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
        ></textarea>
      </div>
    {% endfor %}

    <div class="flex items-center justify-between pt-2">
      <span class="text-[11px] text-slate-400">Evaluated with Gemini AI against technical accuracy</span>
      <button
        type="submit"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-4 py-1.5 rounded transition-colors"
      >
        Submit Answers & Grade
      </button>
    </div>
  </form>
</div>
